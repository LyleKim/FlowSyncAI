# Production stack: MySQL + gunicorn + nginx (static SPA, /api proxy).
#   docker compose -f docker-compose.prod.yml up -d --build
# TLS is terminated in front of this (ALB or Caddy, see docs/deploy/aws-plan.md).
# The dev stack (docker-compose.yml) is unchanged.
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:?set DB_NAME}
      MYSQL_USER: ${DB_USER:?set DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    # no ports: only reachable on the compose network
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # one-shot: schema changes run before the app starts, never inside gunicorn workers
  migrate:
    build: ./backend
    image: flowsync-backend:prod
    env_file: ${ENV_FILE:-.env}
    environment:
      DB_HOST: db
      DB_PORT: "3306"
    command: ["python", "manage.py", "migrate", "--noinput"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  backend:
    image: flowsync-backend:prod
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    environment:
      DB_HOST: db
      DB_PORT: "3306"
    command: >-
      gunicorn config.wsgi:application --bind 0.0.0.0:8000
      --workers ${GUNICORN_WORKERS:-3} --timeout 150 --access-logfile -
    healthcheck:
      # Host must be in DJANGO_ALLOWED_HOSTS, so send the first configured one
      test: ["CMD", "python", "-c", "import os,urllib.request as u; h=os.environ.get('DJANGO_ALLOWED_HOSTS','localhost').split(',')[0].strip(); u.urlopen(u.Request('http://127.0.0.1:8000/api/v1/health/', headers={'Host': h}), timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 3
      start_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
