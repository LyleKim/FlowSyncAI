# Keep an upstream proxy's X-Forwarded-Proto (ALB/Caddy terminate TLS); fall back to our own scheme.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 2m;

    # Django: API, admin, admin static (whitenoise)
    location ~ ^/(api|admin|static)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 150s;  # folder describe = up to 4 Groq batches x 30s
    }

    # Vite output is content-hashed
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # HashRouter: every route is "/", so the fallback is just index.html
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
